name: servicio-backend

namespace: otsugua04-dev

container:
  tag: "build-{{ tag }}"
  port: 8080
  image: "otsugua04/servicio-backend"
  replicas: 2
  cpuRequests: "500m"
  memRequests: "800Mi"
  cpuLimits: "1000m"
  memLimits: "1500Mi"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

configmap:
  SERVICIO_BDD_URL: "http://servicio-bdd-otsugua04-dev.apps.rm2.thpm.p1.openshiftapps.com/api/bdd/"
